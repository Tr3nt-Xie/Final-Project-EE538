# AegisProxy example configuration.
# Format: `key = value`, `#` comments, one [backend] section per upstream.
# Unknown keys are rejected so typos cannot silently disable a feature.

listen_host = 0.0.0.0
listen_port = 8080

# round_robin | least_connections | adaptive
strategy = round_robin

max_connections = 1024
buffer_limit_bytes = 65536
listen_backlog = 128
log_level = info

# Health monitoring (HealthMonitor — logic not implemented yet)
health_interval_ms = 2000
health_timeout_ms = 500
healthy_threshold = 2
unhealthy_threshold = 3
health_path = /health

[backend]
name = app-1
host = 127.0.0.1
port = 9001
weight = 1

[backend]
name = app-2
host = 127.0.0.1
port = 9002
weight = 1
